[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consensus-hardening-protocol"
version = "0.1.0"
description = "Adversarial decision hardening for multi-agent systems — R0 gate, adversary pass, human lock, signed decision record."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shyam Desigan", email = "sam@cubiczan.com" }]
keywords = ["ai-agents", "multi-agent", "governance", "decision", "audit", "chp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
resilience = ["cubiczan-resilience"]
cockroachdb = ["sqlalchemy>=2.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/icohangar-ops/consensus-hardening-protocol"
Specification = "https://github.com/icohangar-ops/consensus-hardening-protocol/blob/main/spec/CHP-v1.0.md"

[project.scripts]
chp = "chp.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["chp*"]

[tool.setuptools.package-data]
chp = ["kit/*"]

[tool.pytest.ini_options]
testpaths = ["tests/chp"]
