# CHP Action Configuration — Enterprise Compliance Pipeline
# Generated by CubicZanOS Daily Build Cycle
# Defines default gating behavior, lock progression, sandbox replay settings

version: "1.0"
project: consensus-hardening-protocol

# ── Default Gating Behavior ──────────────────────────────────────────
gating:
  default_mode: moderate      # moderate: FAIL blocks, ESCALATE warns
                              # strict:   FAIL + ESCALATE both block
                              # permissive: only FAIL blocks
  severity_threshold: 0.0     # 0.0 = gate on any R0 violation
                              # 0.0-1.0 = only gate above threshold

# ── Lock Progression ─────────────────────────────────────────────────
lock_progression:
  default: auto_hold          # auto_hold: auto-advance LOCK if all gates pass
                              # auto_pass: skip hold, lock immediately
                              # manual:    require human approval for each step
  sequence:
    - EXPLORING
    - PROVISIONAL_LOCK
    - LOCKED

# ── Sandbox Replay (SuperServe) ──────────────────────────────────────
sandbox_replay:
  enabled: true
  hash_verification: required    # required | optional | disabled
  step_sequence:
    - foundation_disclosure
    - adversarial_attack
    - r0_gate_assessment
    - lock_progression
    - deterministic_replay
  timeout_s: 30

# ── Per-Vertical Overrides ──────────────────────────────────────────
verticals:
  finance:
    gating_mode: strict
    severity_threshold: 0.0
    notification_channels: []
  
  healthcare:
    gating_mode: strict
    severity_threshold: 0.0
    notification_channels: []
  
  legal:
    gating_mode: moderate
    severity_threshold: 0.3
    notification_channels: []
  
  engineering:
    gating_mode: strict
    severity_threshold: 0.0
    notification_channels: []

# ── Notifications ───────────────────────────────────────────────────
notifications:
  slack:
    enabled: false
    webhook_url: ""           # Set per-environment
  email:
    enabled: false
    recipients: []            # Set per-environment
