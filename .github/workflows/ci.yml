# Test suite for the standard-kit tooling — notably the canonical evidence-matrix
# verifier and its refusal-rule tests. The suite runs twice: once with PyYAML
# available and once with `import yaml` raising, which forces the verifier's
# vendored stdlib fallback parser (the path sibling repos hit when PyYAML is
# not installed).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: pip install pytest pyyaml
      - name: Suite (PyYAML available)
        run: python3 -m pytest tests -q
      - name: Suite (fallback parser — PyYAML raising on import)
        run: |
          mkdir -p .noyaml
          printf 'raise ImportError("PyYAML blocked for fallback-path testing")\n' > .noyaml/yaml.py
          PYTHONPATH=.noyaml python3 -m pytest tests -q
          rm -rf .noyaml
