name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q tests/chp
      - name: CHP v1.0 conformance
        # exits non-zero unless every golden vector passes
        run: python spec/conformance/run_conformance.py --adapter reference
  test-suite:
    # Evidence-matrix verifier suite — canonical kit tools. Runs twice: with
    # PyYAML available, and with `import yaml` raising, which forces the
    # verifier's vendored stdlib fallback parser (the path sibling repos hit
    # when PyYAML is not installed).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Install test deps
        run: pip install pytest pyyaml
      - name: Evidence-matrix suite (PyYAML available)
        run: python3 -m pytest -q tests/test_verify_evidence_matrix.py
      - name: Evidence-matrix suite (fallback parser — PyYAML raising on import)
        run: |
          mkdir -p .noyaml
          printf 'raise ImportError("PyYAML blocked for fallback-path testing")\n' > .noyaml/yaml.py
          PYTHONPATH=.noyaml python3 -m pytest -q tests/test_verify_evidence_matrix.py
          rm -rf .noyaml
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
